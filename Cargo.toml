[workspace]
members = ["crates/orient-core", "crates/orient-py"]
resolver = "2"

[workspace.package]
version = "0.1.0-dev.5"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
