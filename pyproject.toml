[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "orient-colors"
version = "0.1.0.dev2"
description = "Wallpaper colors, readable palettes and portable theme templates"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["pillow==12.3.0"]

[project.urls]
Homepage = "https://github.com/nacre-desktop/orient"
Issues = "https://github.com/nacre-desktop/orient/issues"

[project.scripts]
orient = "orient.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/orient"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
"tests/orient-gallery/*.py" = ["E402"]
