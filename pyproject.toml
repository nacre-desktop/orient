[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "orient-colors"
version = "0.1.0.dev5"
description = "Wallpaper colors, readable palettes and portable theme templates"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pillow>=11,<13"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/nacre-desktop/orient"
Issues = "https://github.com/nacre-desktop/orient/issues"

[project.scripts]
orient = "orient.cli:main"

[tool.maturin]
manifest-path = "crates/orient-py/Cargo.toml"
python-source = "src"
module-name = "orient._core"
features = ["pyo3/extension-module"]
include = [
  { path = "tests/**/*", format = "sdist" },
  { path = "scripts/*", format = "sdist" },
  { path = "docs/**/*", format = "sdist" },
  { path = "VERSION", format = "sdist" },
  { path = "CHANGELOG.md", format = "sdist" },
  { path = "Cargo.lock", format = "sdist" },
]
exclude = ["docs/development/progress/**"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
"tests/orient-gallery/*.py" = ["E402"]
