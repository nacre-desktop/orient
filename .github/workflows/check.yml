name: Engine checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.13"
            pillow: "11.0.0"
          - python: "3.13"
            pillow: "12.3.0"
          - python: "3.14"
            pillow: "12.3.0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg liblcms2-dev pkg-config
          cargo build --release --locked -p orient-cli
          python -m pip install . "pillow==${{ matrix.pillow }}" ruff==0.16.10 build
      - name: Lint, test and build
        run: |
          ruff format --check .
          ruff check .
          python -m unittest discover -s tests
          python tests/parity/check_golden.py -q
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test --quiet
          python -m build

  distributions:
    uses: ./.github/workflows/distributions.yml
