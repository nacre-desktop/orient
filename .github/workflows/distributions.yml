name: Distribution checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      source_sha256: ${{ steps.build-distributions.outputs.source_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Build sdist and wheel from sdist; check metadata
        id: build-distributions
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg liblcms2-dev pkg-config
          cargo build --release --locked -p orient-cli --bins --example normalized_frames
          python -m pip install . build twine ruff==0.16.10
          ruff format --check .
          ruff check .
          python -m unittest discover -s tests
          python tests/parity/check_native_golden.py -q
          python -m build
          python -m twine check --strict dist/*
          source_digest=$(sha256sum dist/*.tar.gz | cut -d ' ' -f 1)
          printf 'source_sha256=%s\n' "$source_digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist
      - name: Install wheel in clean venv and exercise CLI/library/templates
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/python" -m pip install dist/*.whl
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          "$RUNNER_TEMP/smoke/bin/python" -I scripts/smoke_wheel.py \
            "$PWD/tests/orient-gallery/images/coast-day.png" --version "$version"
  arch:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist
      - name: Build with Arch devtools in a clean chroot
        env:
          SOURCE_SHA256: ${{ needs.build.outputs.source_sha256 }}
        run: |
          mkdir "$RUNNER_TEMP/arch"
          # Verify this run's development archive against the build job's digest.
          printf '%s  %s\n' "$SOURCE_SHA256" dist/*.tar.gz | sha256sum --check
          cp packaging/arch/PKGBUILD dist/*.tar.gz "$RUNNER_TEMP/arch/"
          # Development CI packages the snapshot, not the immutable release asset.
          # The committed development recipe uses a fixed Git revision.
          sed -i 's|source=(.*|source=("orient_colors-${_pyver}.tar.gz")|' "$RUNNER_TEMP/arch/PKGBUILD"
          sed -i "s|^sha256sums=.*|sha256sums=('$SOURCE_SHA256')|" "$RUNNER_TEMP/arch/PKGBUILD"
          sed -i 's|^_srcdir=.*|_srcdir="orient_colors-${_pyver}"|' "$RUNNER_TEMP/arch/PKGBUILD"
          # Devtools assigns systemd slices, so its container host needs systemd
          # as PID 1, not just an interactive shell with a machine ID.
          container=$(docker run --detach --privileged --cgroupns=host --tmpfs /run --tmpfs /tmp \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v "$RUNNER_TEMP/arch:/work" \
            archlinux:base-devel /usr/lib/systemd/systemd)
          trap 'docker rm --force "$container"' EXIT
          docker exec "$container" bash -euxc '
            pacman-key --init
            pacman-key --populate archlinux
            pacman -Syu --noconfirm devtools sudo
            useradd -m builder
            printf "builder ALL=(ALL) NOPASSWD: ALL\n" > /etc/sudoers.d/builder
            chown -R builder:builder /work
            cd /work
            sudo -u builder extra-x86_64-build
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arch-package
          path: ${{ runner.temp }}/arch/*.pkg.tar.zst
          if-no-files-found: error
