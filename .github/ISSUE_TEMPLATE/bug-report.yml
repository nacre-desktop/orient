name: Bug report
description: Report a reproducible Orient problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value:
        For suspected vulnerabilities, use [private reporting](https://github.com/nacre-desktop/orient/security/advisories/new),
        not a public issue. See [SECURITY.md](https://github.com/nacre-desktop/orient/blob/main/SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe one problem and when it started.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description:
        Number the steps, including the exact command or UI action. Use public demo data when
        possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happens? Include error messages and relevant sanitized logs.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Engine and environment
      description:
        Orient version/commit, OS/architecture, Python and Pillow versions, FFmpeg version if
        sampling video, and source-install or package-install method.
    validations:
      required: true
  - type: textarea
    id: image
    attributes:
      label: Image or animation details
      description:
        File type, dimensions, color profile, alpha/transparency, and animation/video duration
        and frame rate if relevant. Attach a redistributable non-private example or a minimal synthetic
        reproduction; if you cannot share the source, explain how to reproduce its properties.
    validations:
      required: true
  - type: textarea
    id: palette
    attributes:
      label: Palette and invocation details
      description:
        Exact CLI command or Python call, personality, dark/light mode, background policy, accent/overrides
        and sampling settings. Include relevant actual/expected color values, sanitized palette JSON (including
        formatVersion), or export template. State if an option is not used.
      render: text
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Screenshots or additional evidence
      description:
        "Optional: use public demo data and remove private paths, usernames, account details,
        notifications and image metadata."
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label:
            I checked existing issues and removed credentials, account data and other private information
            from this report.
          required: true
